[platformio]
default_envs = ground

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  sandeepmistry/LoRa@0.8.0
  links2004/WebSockets@2.6.1
  bblanchon/ArduinoJson@7.2.1

[env:ground]
build_flags = -D SYNAPSE_GROUND=1

[env:flight_bridge]
build_flags = -D SYNAPSE_GROUND=0
